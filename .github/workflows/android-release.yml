name: Android Release

# A v* tag builds the signed release APK and publishes it as a GitHub release.
# A manual run rebuilds the release for an existing tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.4.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # SHA-256 of the release signing certificate. A release signed by any other
  # key fails the run.
  EXPECTED_CERT_SHA256: 3B:0C:B0:B2:F9:D1:3C:FA:B3:6E:06:1A:C4:7F:B3:87:CE:A9:2A:D3:8F:45:EE:59:28:7B:C7:76:43:23:F4:11
  BUILD_TOOLS: 37.0.0

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Check the tag matches versionName
        id: version
        run: |
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "::error::versionName not found in app/build.gradle.kts"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match versionName $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform 37.0, build-tools 37 and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;${BUILD_TOOLS}" "ndk;26.3.11579264" > /dev/null

      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_B64 is not set"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ADOS_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build the signed release
        env:
          ADOS_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ADOS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ADOS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify the signature
        id: apk
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Signed APK not found; outputs:"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          certs="$("$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --print-certs "$apk")"
          echo "$certs"
          actual="$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signing certificate SHA-256 is '$actual', expected '$expected'"
            exit 1
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Name the APK and write SHA256SUMS
        id: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          mkdir -p dist
          name="ados-gcs-${VERSION}.apk"
          cp "$APK" "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$notes"
          fi
          if [ ! -s "$notes" ] || ! grep -q '[^[:space:]]' "$notes"; then
            {
              echo "ADOS Android GCS ${VERSION}."
              echo
              echo "Changes since the previous release: see the commit history."
            } > "$notes"
          fi
          {
            echo
            echo "### Verify the download"
            echo
            echo "Signing certificate SHA-256:"
            echo
            echo "\`$EXPECTED_CERT_SHA256\`"
            echo
            echo "Check it with \`apksigner verify --print-certs ados-gcs-${VERSION}.apk\` and the file with \`sha256sum -c SHA256SUMS\`."
          } >> "$notes"
          cat "$notes"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/ados-gcs-${VERSION}.apk" dist/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --title "ADOS Android GCS ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag \
              "dist/ados-gcs-${VERSION}.apk" dist/SHA256SUMS
          fi

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
